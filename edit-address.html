<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Modifier une adresse</title>
    </head>
    <body>
        <h2>Modifier une adresse</h2>
        <form action="edit-address.php" method="POST">
            <label>ID :</label>
            <input type="text" name="id" required>
            <br><br>
    
            <label>Street :</label>
            <input type="text" name="street" required>
            <br><br>
    
            <label>City :</label>
            <input type="text" name="city" required>
            <br><br>
    
            <label>Zipcode :</label>
            <input type="text" name="zipcode" required>
            <br><br>
    
            <button type="submit">Modifier l'adresse</button>
        </form>
    </body>
</html>
